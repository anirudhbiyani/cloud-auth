name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Test, Build & Security
    # A matrix, so the non-Unix code path is compiled somewhere. core/state.go
    # locks with syscall.Flock under //go:build unix and has a documented no-op
    # fallback in state_lock_other.go — which a single ubuntu runner never
    # builds, so it could stop compiling and CI would not notice.
    #
    # Only ubuntu runs the full suite. Windows compiles, vets and tests: it is
    # here for the build tag, not to be a second full CI.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.0"

      - name: Download dependencies
        run: go mod download

      # Formatting and module hygiene. Cheap, and a failure here is unambiguous.
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: go mod tidy
        if: matrix.os == 'ubuntu-latest'
        run: go mod tidy -diff

      # Lint. Pinned rather than 'latest', so a lint failure is attributable to a
      # change in this repository and not to a linter release that landed
      # overnight — and it no longer carries continue-on-error, which made the
      # whole step advisory. It passes clean today; see docs/BASELINE.md.
      - name: golangci-lint
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=5m

      # Test. One pass with the race detector and coverage, rather than three
      # separate runs of the same suite.
      #
      # shell: bash on every run step, because the Windows runner defaults to
      # PowerShell, which parses `-coverprofile=coverage.out ./...` as its own
      # arguments and hands go a package named ".out".
      - name: Test
        shell: bash
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      # The architecture tests shell out to `go list`, so they are worth naming
      # separately: a failure here is a layering regression, not a logic bug, and
      # the distinction saves a reviewer a minute.
      - name: Architecture invariants
        if: matrix.os == 'ubuntu-latest'
        run: go test ./test/architecture/ -v

      # Vet the default build. A build tag only ADDS files, so the tagged run
      # below covers this too — but naming only that one hid the fact that vet
      # runs at all, and a reader should not have to know the tag semantics to
      # see it.
      - name: Vet
        shell: bash
        run: go vet ./...

      # Compile the build-tagged integration suite. It needs real cloud
      # credentials to run, but it must at least keep compiling.
      - name: Vet integration-tagged tests
        shell: bash
        run: go vet -tags integration ./...

      # Seed corpora only: fuzzing proper is not a CI-duration activity, but a
      # target that no longer compiles or fails its seeds should break the build.
      - name: Fuzz seed corpora
        if: matrix.os == 'ubuntu-latest'
        run: go test -run 'Fuzz' ./...

      # Build
      - name: Build
        shell: bash
        run: go build -v ./...

      # Security
      #
      # Known vulnerabilities in dependencies, gated. govulncheck reports only
      # advisories whose vulnerable symbols this code actually reaches, so a
      # finding here is a real call path and not a version-range warning —
      # which is why it is allowed to fail the build. The tool version is
      # pinned for reproducibility; the advisory database is always fetched
      # live, so a newly-published advisory can turn this red without any
      # change to the code. That is the intended behaviour.
      - name: Run govulncheck
        if: matrix.os == 'ubuntu-latest'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      # Gated on medium-or-higher severity AND confidence. Rationale: this
      # codebase is full of OAuth/RFC 8693 URN constants, IMDS header names, and
      # token-shaped identifiers, so G101 ("hardcoded credentials") fires ~20
      # times at LOW confidence with zero real findings; G104 (unchecked
      # fmt.Fprintf returns) is LOW severity. Letting that noise fail the build
      # trains people to ignore the scanner, which is worse than not running it.
      # Genuinely-intended patterns are annotated in-line with `#nosec` plus a
      # justification, so they stay visible in review rather than being silently
      # filtered here.
      # Pinned: @master is a third-party action whose behaviour can change
      # under us between two runs of the same commit.
      - name: Run Gosec Security Scanner
        if: matrix.os == 'ubuntu-latest'
        uses: securego/gosec@v2.29.0
        with:
          args: -severity medium -confidence medium ./...
